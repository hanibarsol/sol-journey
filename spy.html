<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>בדיקת הקפיצה בשיר של מי</title>
<style>
  :root{ color-scheme:light; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{ margin:0; background:#fff; font-family:system-ui,"Segoe UI",Arial,sans-serif; }
  /* the same box the lesson lives in inside the game */
  #box{ position:fixed; inset:0; z-index:60; background:#fff; display:flex; flex-direction:column; }
  #frameBox{ flex:1 1 auto; min-height:0; overflow:hidden; display:flex;
    align-items:flex-start; justify-content:center; background:#fff; }
  #f{ width:100%; flex:1 1 auto; min-width:0; border:0; display:block; background:#fff; }
  #ask{ position:fixed; z-index:150; left:10px; bottom:10px; display:none;
    font:800 14px/1 system-ui,Arial; padding:11px 16px; border-radius:999px; border:0;
    background:#17A79B; color:#04231f; box-shadow:0 6px 18px -8px rgba(0,0,0,.8); }
  #ask.on{ display:block; }
  #panel{ position:fixed; inset:0; z-index:200; overflow:auto; padding:18px 16px 28px;
    background:rgba(8,5,22,.96); color:#fff; direction:rtl; }
  #panel.off{ display:none; }
  #panel h1{ font-size:19px; margin:0 0 8px; color:#FFD987; }
  #panel p{ margin:0 0 14px; font-size:14px; line-height:1.55; color:#d6d0f0; }
  #panel ol{ margin:0 0 16px; padding-inline-start:20px; font-size:14px; line-height:1.7; color:#d6d0f0; }
  #panel button{ font:inherit; font-size:17px; font-weight:800; padding:13px 26px;
    border-radius:999px; border:0; background:#17A79B; color:#04231f; }
  #panel table{ width:100%; border-collapse:collapse; margin-top:14px; }
  #panel td{ padding:8px 4px; border-bottom:1px solid rgba(255,255,255,.12); font-size:15px; }
  #panel td.v{ text-align:left; font-weight:800; }
  #panel .bad{ color:#FF8A6B; } #panel .ok{ color:#8FD9D2; }
  #panel .verdict{ margin-top:16px; font-size:18px; font-weight:800; color:#FFD987; }
  #panel .note{ margin-top:10px; font-size:13px; color:#9d94c9; }
</style>
</head>
<body>
<div id="box">
  <div id="frameBox"><iframe id="f" title="שיעור" allow="autoplay; fullscreen"></iframe></div>
</div>
<button id="ask">מה מצאת?</button>

<div id="panel">
  <h1>בדיקת הקפיצה בשיר של מי</h1>
  <p>הדף פותח את השיעור האמיתי, בדיוק כמו במשחק, ומודד ברקע כל תזוזה על המסך בזמן שאת מנגנת.</p>
  <ol>
    <li>ללחוץ "לפתוח את השיעור"</li>
    <li>לשחק עד החלק שבו מנגנים לפי המוסיקה</li>
    <li>ברגע שהמסך קופץ, ללחוץ על הכפתור הירוק "מה מצאת?" בפינה למטה</li>
  </ol>
  <button id="go">לפתוח את השיעור</button>
  <div id="out"></div>
</div>

<script>
(function(){
  var frame = document.getElementById("f");
  var box = document.getElementById("frameBox");
  var panel = document.getElementById("panel");
  var out = document.getElementById("out");
  var ask = document.getElementById("ask");

  function fitFrame(){
    var h = box.clientHeight;
    if (h) frame.style.height = Math.round(h) + "px";
  }
  window.addEventListener("resize", fitFrame);
  fitFrame();

  document.getElementById("go").addEventListener("click", function(){
    this.disabled = true; this.textContent = "פותחת...";
    start();
  });

  function start(){
    fetch("lessons/mire.html").then(function(r){ return r.ok ? r.text() : null; })
      .catch(function(){ return null; })
      .then(function(doc){
        if (!doc){
          panel.classList.remove("off");
          out.innerHTML = '<p class="verdict">לא הצלחתי לטעון את השיעור.</p>';
          return;
        }
        var boot = '<scr' + 'ipt>window.__solBase=0;window.__solFirst=true;' +
                   'window.__solWhich="mire";</scr' + 'ipt>';
        frame.srcdoc = boot + doc + probe();
        panel.classList.add("off");
        ask.classList.add("on");
        fitFrame(); setTimeout(fitFrame, 60); setTimeout(fitFrame, 320);
      });
  }

  /* the watcher runs inside the lesson, where the real layout is */
  function probe(){
    return [
'<scr' + 'ipt>(function(){',
'  var WATCH = [',
'    ["החמשה", "stage"], ["הפס העליון", null, ".top"], ["שורת הטקסט", null, ".say"],',
'    ["המסגרת הפנימית", null, ".fit"], ["הפסנתר", "piano"], ["המסלול", "track"]',
'  ];',
'  var seen = {}, stat = {}, recent = [], t0 = performance.now();',
'  var lastWin = "", winHits = 0, winWorst = "";',
'  function box(w){',
'    var e = w[1] ? document.getElementById(w[1]) : document.querySelector(w[2]);',
'    if (!e) return null;',
'    var r = e.getBoundingClientRect();',
'    return [Math.round(r.left), Math.round(r.top), Math.round(r.width), Math.round(r.height)];',
'  }',
'  function tick(){',
'    for (var i = 0; i < WATCH.length; i++){',
'      var name = WATCH[i][0], b = box(WATCH[i]);',
'      if (!b) continue;',
'      var key = b.join(",");',
'      if (seen[name] && seen[name] !== key){',
'        var a = seen[name].split(",").map(Number);',
'        var dy = Math.abs(b[1] - a[1]), dx = Math.abs(b[0] - a[0]);',
'        var dh = Math.abs(b[3] - a[3]), dw = Math.abs(b[2] - a[2]);',
'        var d = Math.max(dy, dx, dh, dw);',
'        var s = stat[name] || (stat[name] = { n:0, max:0, how:"" });',
'        s.n++;',
'        if (d > s.max){ s.max = d; s.how = (dy >= dx ? "למעלה ולמטה" : "לצדדים"); }',
'        if (d >= 2){',
'          recent.unshift(((performance.now() - t0) / 1000).toFixed(1) + "s  " + name + "  " + d + "px");',
'          recent = recent.slice(0, 5);',
'        }',
'      }',
'      seen[name] = key;',
'    }',
'    var vv = window.visualViewport;',
'    var w = window.innerWidth + "x" + window.innerHeight +',
'      (vv ? " / " + Math.round(vv.width) + "x" + Math.round(vv.height) : "");',
'    if (lastWin && w !== lastWin){ winHits++; winWorst = lastWin + "  ->  " + w; }',
'    lastWin = w;',
'    requestAnimationFrame(tick);',
'  }',
'  requestAnimationFrame(tick);',
'  /* each answer closes a chapter: the counters start again, so the next one',
'     speaks only about what happened since */',
'  window.__spyAsk = function(){',
'    var out = { stat:stat, recent:recent, winHits:winHits, winWorst:winWorst,',
'                secs:((performance.now() - t0) / 1000).toFixed(0),',
'                win:window.innerWidth + "x" + window.innerHeight };',
'    stat = {}; recent = []; winHits = 0; winWorst = ""; t0 = performance.now();',
'    return out;',
'  };',
'})();</scr' + 'ipt>'
    ].join("\n");
  }

  ask.addEventListener("click", function(){
    var d = null;
    try{ d = frame.contentWindow.__spyAsk(); }catch(e){}
    panel.classList.remove("off");
    if (!d){
      out.innerHTML = '<p class="verdict">לא הצלחתי לקרוא את המדידות. תגידי לי ואבדוק.</p>';
      return;
    }
    var names = Object.keys(d.stat);
    var worstName = "", worstVal = -1, worstHow = "";
    names.forEach(function(k){
      if (d.stat[k].max > worstVal){
        worstVal = d.stat[k].max; worstName = k; worstHow = d.stat[k].how;
      }
    });
    var html = "<table>";
    names.forEach(function(k){
      var s = d.stat[k], bad = s.max >= 2;
      html += "<tr><td>" + k + "</td><td class=\"v " + (bad ? "bad" : "ok") + "\">" +
        (bad ? s.max + " פיקסלים " + s.how + ", " + s.n + " פעמים" : "לא זז") + "</td></tr>";
    });
    html += "<tr><td>גודל החלון</td><td class=\"v " + (d.winHits ? "bad" : "ok") + "\">" +
      (d.winHits ? "השתנה " + d.winHits + " פעמים" : "לא השתנה") + "</td></tr>";
    html += "</table>";
    html += '<p class="verdict">' + (worstVal >= 2
      ? "הכי זז: " + worstName + ", " + worstVal + " פיקסלים " + worstHow
      : "שום דבר לא זז") + "</p>";
    if (d.winWorst) html += '<p class="note">שינוי החלון האחרון: ' + d.winWorst + "</p>";
    if (d.recent.length) html += '<p class="note">אחרונים: ' + d.recent.join("  |  ") + "</p>";
    html += '<p class="note">מסך: ' + d.win + "  |  נמדדו " + d.secs + " שניות אחרונות</p>";
    html += '<p class="note">הספירה מתחילה מחדש עכשיו, אז הפעם הבאה תספר רק על מה שקרה מכאן והלאה.</p>';
    html += '<p class="note" style="margin-top:16px"><button id="back">לחזור לשיעור</button></p>';
    out.innerHTML = html;
    var b = document.getElementById("back");
    if (b) b.addEventListener("click", function(){ panel.classList.add("off"); });
  });
})();
</script>
</body>
</html>
