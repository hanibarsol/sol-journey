<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>בדיקת הקפיצה בשיר של מי</title>
<style>
  :root{ color-scheme:light; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{ margin:0; background:#fff; font-family:system-ui,"Segoe UI",Arial,sans-serif; }
  /* exactly the box the lesson lives in inside the game */
  #box{ position:fixed; inset:0; z-index:60; background:#fff; display:flex; flex-direction:column; }
  #frameBox{ flex:1 1 auto; min-height:0; overflow:hidden; display:flex;
    align-items:flex-start; justify-content:center; background:#fff; }
  #f{ width:100%; flex:1 1 auto; min-width:0; border:0; display:block; background:#fff; }
  #panel{ position:fixed; inset:0; z-index:200; overflow:auto; padding:18px 16px 28px;
    background:rgba(8,5,22,.96); color:#fff; direction:rtl; }
  #panel.off{ display:none; }
  #panel h1{ font-size:19px; margin:0 0 8px; color:#FFD987; }
  #panel p{ margin:0 0 14px; font-size:14px; line-height:1.55; color:#d6d0f0; }
  #panel button{ font:inherit; font-size:17px; font-weight:800; padding:13px 26px;
    border-radius:999px; border:0; background:#17A79B; color:#04231f; }
  #panel table{ width:100%; border-collapse:collapse; margin-top:14px; }
  #panel td{ padding:8px 4px; border-bottom:1px solid rgba(255,255,255,.12); font-size:15px; }
  #panel td.v{ text-align:left; font-weight:800; }
  #panel .bad{ color:#FF8A6B; } #panel .ok{ color:#8FD9D2; }
  #panel .verdict{ margin-top:16px; font-size:18px; font-weight:800; color:#FFD987; }
  #panel .note{ margin-top:12px; font-size:13px; color:#9d94c9; }
</style>
</head>
<body>
<div id="box">
  <div id="frameBox"><iframe id="f" title="שיעור" allow="autoplay; fullscreen"></iframe></div>
</div>

<div id="panel">
  <h1>בדיקת הקפיצה בשיר של מי</h1>
  <p>הבדיקה פותחת את השיעור האמיתי, בדיוק כמו במשחק, ואז מפעילה בנפרד כל דבר שקורה
     כשמתקבל תו. אחרי כל אחד היא מודדת אם המסך זז, ובסוף אומרת מי מהם אשם.</p>
  <p>אורכת כעשרים שניות. אין צורך לנגן ואין צורך לגעת.</p>
  <button id="go">להתחיל</button>
  <div id="out"></div>
</div>

<script>
(function(){
  var frame = document.getElementById("f");
  var box = document.getElementById("frameBox");
  var panel = document.getElementById("panel");
  var out = document.getElementById("out");

  function fitFrame(){
    var h = box.clientHeight;
    if (h) frame.style.height = Math.round(h) + "px";
  }
  window.addEventListener("resize", fitFrame);
  fitFrame();

  function show(html){ panel.classList.remove("off"); out.innerHTML = html; }

  document.getElementById("go").addEventListener("click", function(){
    this.disabled = true; this.textContent = "רץ...";
    start();
  });

  function start(){
    fetch("lessons/mire.html").then(function(r){ return r.ok ? r.text() : null; })
      .catch(function(){ return null; })
      .then(function(doc){
        if (!doc){ show('<p class="verdict">לא הצלחתי לטעון את השיעור.</p>'); return; }
        var boot = '<scr' + 'ipt>window.__solBase=0;window.__solFirst=true;' +
                   'window.__solWhich="mire";</scr' + 'ipt>';
        /* the pieces that run on a scored note live inside the lesson's closure,
           so a hook is opened for them right where they are defined */
        var hook = 'window.__dbg={celebrate:celebrate,flyCoin:flyCoin,addCoin:addCoin,' +
          'payGold:payGold,key:function(){var k=(typeof keyEl!=="undefined"&&keyEl[0])?keyEl[0]:doKey;' +
          'if(!k)return;k.classList.add("hit");setTimeout(function(){k.classList.remove("hit");},320);}};\n';
        if (doc.indexOf("function onHit(){") < 0){
          show('<p class="verdict">השיעור השתנה ואני לא מוצאת בו את רגע קבלת התו. תגידי לי ואתקן.</p>');
          return;
        }
        doc = doc.replace("function onHit(){", hook + "function onHit(){");
        frame.srcdoc = boot + doc + probe();
        panel.classList.add("off");
        fitFrame(); setTimeout(fitFrame, 60); setTimeout(fitFrame, 320);
      });
  }

  /* the probe runs inside the lesson, where the real layout is */
  function probe(){
    return [
'<scr' + 'ipt>(function(){',
'  function R(){',
'    var e = document.getElementById("stage");',
'    if (!e) return null;',
'    var r = e.getBoundingClientRect();',
'    return { x:r.left, y:r.top, w:r.width, h:r.height };',
'  }',
'  function watch(ms){',
'    return new Promise(function(res){',
'      var a = R(), worst = 0, how = "";',
'      var t0 = performance.now();',
'      (function loop(){',
'        var b = R();',
'        if (a && b){',
'          var dy = Math.abs(b.y - a.y), dx = Math.abs(b.x - a.x);',
'          var d = Math.max(dy, dx, Math.abs(b.w - a.w), Math.abs(b.h - a.h));',
'          if (d > worst){ worst = d; how = dy >= dx ? "למעלה ולמטה" : "לצדדים"; }',
'        }',
'        if (performance.now() - t0 < ms) requestAnimationFrame(loop);',
'        else res({ d:Math.round(worst), how:how });',
'      })();',
'    });',
'  }',
'  var TESTS = [',
'    ["הבזק הקליד", function(d){ d.key(); }],',
'    ["ניצוצות", function(d){ var r = R() || { x:120, y:300 }; d.celebrate(r.x + 60, r.y + 120); }],',
'    ["מטבע מעופף", function(d){ var r = R() || { x:120, y:300 }; d.flyCoin(r.x + 60, r.y + 120); }],',
'    ["ספירת המטבע", function(d){ d.addCoin(); }],',
'    ["תו הזהב", function(d){ d.payGold(); }]',
'  ];',
'  function report(html){ try{ parent.__spyReport(html); }catch(e){} }',
'  setTimeout(function(){',
'    var b = document.getElementById("ovB"); if (b) b.click();',
'    setTimeout(run, 2200);',
'  }, 600);',
'  async function run(){',
'    var d = window.__dbg;',
'    if (!d){ report(\'<p class="verdict">לא הצלחתי להיכנס לשיעור. תגידי לי ואבדוק.</p>\'); return; }',
'    var rows = [], worstName = "", worstVal = -1;',
'    rows.push(["בלי לעשות כלום", await watch(700)]);',
'    for (var i = 0; i < TESTS.length; i++){',
'      try{ TESTS[i][1](d); }catch(e){}',
'      var r = await watch(900);',
'      rows.push([TESTS[i][0], r]);',
'      if (r.d > worstVal){ worstVal = r.d; worstName = TESTS[i][0]; }',
'      await new Promise(function(z){ setTimeout(z, 300); });',
'    }',
'    var html = "<table>";',
'    rows.forEach(function(p){',
'      var bad = p[1].d > 2;',
'      html += "<tr><td>" + p[0] + "</td><td class=\\"v " + (bad ? "bad" : "ok") + "\\">" +',
'        (bad ? p[1].d + " פיקסלים " + p[1].how : "לא זז") + "</td></tr>";',
'    });',
'    html += "</table>";',
'    html += \'<p class="verdict">\' + (worstVal > 2',
'      ? "האשם: " + worstName + ", " + worstVal + " פיקסלים"',
'      : "שום דבר מהם לא הזיז את המסך") + "</p>";',
'    html += \'<p class="note">גודל החלון: \' + window.innerWidth + "x" + window.innerHeight + "</p>";',
'    report(html);',
'  }',
'})();</scr' + 'ipt>'
    ].join("\n");
  }

  window.__spyReport = function(html){ show(html); };
})();
</script>
</body>
</html>
