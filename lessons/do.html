  :root{
    color-scheme:light;
    --ink:#241B3D; --ink-soft:#6C6390;
    --violet:#7B6BFF; --teal:#17A79B; --teal-br:#39E0D0;
    --gold:#FFC44D; --do:#FF4D4D;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; overflow:hidden; overscroll-behavior:none; }   /* שום אנימציה שחורגת לרגע לא תזיז את המסך בנייד */
  body{
    background:
      radial-gradient(90% 55% at 10% 0%, rgba(123,107,255,.07), transparent 60%),
      radial-gradient(80% 50% at 92% 6%, rgba(57,224,208,.08), transparent 62%), #fff;
    color:var(--ink); font-family:'Gisha','Segoe UI',sans-serif;
    min-height:100vh; height:100svh;
    display:flex; flex-direction:column; align-items:center;
    direction:rtl; padding:10px 10px 12px; overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2{ font-family:'Rod','Gisha',serif; margin:0; }

  .top{ width:100%; max-width:560px; flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .title{ font-size:17px; color:var(--violet); font-weight:800; }
  .coin{ position:relative; overflow:hidden; display:flex; align-items:center; gap:7px;
    background:linear-gradient(180deg,#FFF3CF 0%,#FFD978 45%,#F0B32E 100%);
    border:2px solid #C98A00; border-radius:999px; padding:5px 14px 5px 9px;
    font-size:14.5px; font-weight:800; color:#5A3B00;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.85), inset 0 -3px 6px rgba(169,114,10,.35),
      0 3px 0 0 #B07C06, 0 6px 16px -6px rgba(176,124,6,.75); }
  .coin .n{ color:#4A2F00; font-variant-numeric:tabular-nums; min-width:1.4em; text-align:center;
    display:inline-block; text-shadow:0 1px 0 rgba(255,255,255,.6); }
  /* a slow shine sweeping across the gold */
  .coin::after{ content:""; position:absolute; top:-60%; left:-40%; width:30%; height:220%;
    background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.85), rgba(255,255,255,0));
    transform:rotate(18deg); animation:shine 4.5s ease-in-out infinite; pointer-events:none; }
  @keyframes shine{ 0%{ left:-40% } 55%{ left:130% } 100%{ left:130% } }
  /* מונה התווים: זוהר בלבד, בלי התרחבות. ההתרחבות ליד החמשה נראתה כקפיצה */
  .coin.pop{ animation:coinglow .5s ease-out; }
  .coin.pop2{ animation:coinglow2 .5s ease-out; }
  @keyframes coinglow{
    0%{ box-shadow:inset 0 1px 0 rgba(255,255,255,.85), 0 3px 0 0 #B07C06, 0 6px 16px -6px rgba(176,124,6,.75) }
    45%{ box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 3px 0 0 #B07C06, 0 0 30px 10px rgba(255,196,77,.95) }
    100%{ box-shadow:inset 0 1px 0 rgba(255,255,255,.85), 0 3px 0 0 #B07C06, 0 6px 16px -6px rgba(176,124,6,.75) }
  }
  @keyframes coinglow2{
    0%{ box-shadow:inset 0 1px 0 rgba(255,255,255,.85), 0 3px 0 0 #B07C06, 0 6px 16px -6px rgba(176,124,6,.75) }
    45%{ box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 3px 0 0 #B07C06, 0 0 30px 10px rgba(255,196,77,.95) }
    100%{ box-shadow:inset 0 1px 0 rgba(255,255,255,.85), 0 3px 0 0 #B07C06, 0 6px 16px -6px rgba(176,124,6,.75) }
  }
  @keyframes coinpop{
    0%{ transform:scale(1); box-shadow:inset 0 1px 0 rgba(255,255,255,.85), 0 3px 0 0 #B07C06, 0 6px 16px -6px rgba(176,124,6,.75) }
    45%{ transform:scale(1.3); box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 3px 0 0 #B07C06, 0 0 30px 10px rgba(255,196,77,.95) }
    100%{ transform:scale(1); box-shadow:inset 0 1px 0 rgba(255,255,255,.85), 0 3px 0 0 #B07C06, 0 6px 16px -6px rgba(176,124,6,.75) }
  }
@keyframes coinpop2{
    0%{ transform:scale(1); box-shadow:inset 0 1px 0 rgba(255,255,255,.85), 0 3px 0 0 #B07C06, 0 6px 16px -6px rgba(176,124,6,.75) }
    45%{ transform:scale(1.3); box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 3px 0 0 #B07C06, 0 0 30px 10px rgba(255,196,77,.95) }
    100%{ transform:scale(1); box-shadow:inset 0 1px 0 rgba(255,255,255,.85), 0 3px 0 0 #B07C06, 0 6px 16px -6px rgba(176,124,6,.75) }
  }

  .fit{ flex:1 1 auto; min-height:0; width:100%; position:relative; overflow:hidden; }
  /* נייד מסובב לרוחב: הקישוט יוצא מהזרימה אל השוליים, והמלבן מקבל את כל הגובה */
  @media (orientation:landscape) and (max-height:560px){
    body{ padding:4px 6px; }
    .top{ position:absolute; top:8px; left:10px; right:auto; width:auto; max-width:none; z-index:6; gap:6px; }   /* בצד הפנוי, רחוק מכפתור החזרה */
    .say{ position:absolute; bottom:4px; right:0; left:0; margin:0; z-index:6; }
  }
  .scaler{ position:absolute; left:0; top:0; transform-origin:top left; }   /* ממוקם במפורש, לא תלוי בכיוון הכתיבה */
  .stage{ position:relative; width:480px; height:384px; direction:ltr; }

  /* נייד לאורך: אותו ציור, מלבן גבוה יותר, חמשה פרושה ופסנתר גדול */
  body.tall .stage{ height:620px; }
  body.tall .track{ height:300px; }
  body.tall .clefwrap{ width:164px; height:300px; }   /* מכסה את כל גובה החמשה, אחרת תווים מציצים מתחת למפתח */
  body.tall .clefwrap img{ left:21px; top:45px; height:246px; }
  body.tall .pianoWrap{ top:310px; height:310px; }
  body.tall .piano{ top:2px; height:300px; }
  body.tall .k .lip{ height:44px; }
  body.tall .k .face{ width:46px; bottom:58px; }   /* רחב מהקליד מדי היה נחתך בקצה */
  body.tall .note{ height:42px; }
  body.tall .note .head{ width:42px; height:42px; }
  body.tall .note .ledge{ left:-11px; top:19.4px; width:64px; height:3.2px; }
  body.tall .doLedger{ height:3.2px; }
  body.tall .playhead{ height:288px; }
  body.tall .note .bar{ left:21px; top:11px; height:20px; }
  body.tall .note .stem{ left:37px; top:-72px; height:94px; }

  /* ---------- the staff, which is also the track ---------- */
  .track{ position:absolute; left:0; top:0; width:480px; height:198px; overflow:hidden; border-radius:18px;
    background:#ffffff;
    box-shadow:inset 0 0 0 2px rgba(123,107,255,.3), 0 10px 26px -14px rgba(36,27,61,.45); }
  .track svg.lines{ position:absolute; inset:0; width:100%; height:100%; }

  .note{ position:absolute; height:30px; pointer-events:none; }
  .note .bar{ position:absolute; left:15px; top:8px; height:14px; border-radius:7.5px;
    background:linear-gradient(180deg,#ff6b6b,#ff9e9e); box-shadow:0 0 16px 2px rgba(255,77,77,.45); }
  .note .stem{ position:absolute; left:25px; top:-50px; width:4px; height:66px; z-index:1;

  // ====== שלבי הכנה: קודם פעם אחת, אחר כך שלוש, בלי שעון ======
  var phase = "idle", learnNeed = 0, learnDone = 0, learnNotes = [], learnReady = false;

  function staticNote(x){
    var el = document.createElement("div");
    el.className = "note";
    el.style.width = (HEAD_R + PXPB) + "px";
    el.style.top = (DO_Y - HEAD_R) + "px";

  // ההדגמה: הקליד מנגן את עצמו
  // צליל דו באורך קבוע שמסיים את עצמו. לא נוגע ב-held בכלל.
  function doNote(dur){
    var c = ac(), t0 = c.currentTime;
    var out = c.createGain();
    out.gain.setValueAtTime(0, t0);
    out.gain.linearRampToValueAtTime(0.4, t0 + 0.012);
    out.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    var lp = c.createBiquadFilter();
    lp.type = "lowpass"; lp.Q.value = 0.6;
    lp.frequency.setValueAtTime(2600, t0);
    lp.frequency.exponentialRampToValueAtTime(1100, t0 + dur*0.8);
    lp.connect(out).connect(c.destination);
    [[1,0.9,"sine",0],[1,0.5,"sine",4],[2,0.26,"sine",0],[3,0.11,"triangle",0]].forEach(function(p){
      var o = c.createOscillator(), g = c.createGain();
      o.type = p[2]; o.frequency.setValueAtTime(261.63*p[0], t0);
      if (p[3]) o.detune.setValueAtTime(p[3], t0);
      g.gain.value = p[1];
      o.connect(g).connect(lp);
      o.start(t0); o.stop(t0 + dur + 0.05);
    });
  }

  function demoPress(i){

  function begin(){
    clearT(); ac(); startFx(); ov.classList.add("hide");
    // הפריסה הגבוהה נכנסת כאן, מתחת למסך הפתיחה. אם היא נכנסת ברגע

    if (!LAYOUT_ON){ LAYOUT_ON = true; relayout(); }
    coins = (window.__solBase | 0); coinN.textContent = String(coins);
    tallying = true; flawless = true;
    try{
      wireSong();

  // המנגינה נמוגה כשהפתיחה מוסרת את המסך לחמשה, וחוזרת להתחלה בעוצמה מלאה
  var songFadeId = 0;
  // iOS מתעלם מ-volume של נגן אודיו. ההנמכה ההדרגתית פשוט לא קרתה שם,
  // ונשמעה רק העצירה בסוף. כאן המנגינה עוברת דרך אותו מיקסר שבו נשמעים
  // הקלידים, ושם אפשר להנמיך באמת, בכל מכשיר
  var songGain = null, songWired = false, songFadeT = 0, songLevel = 1;
  function wireSong(){
    if (songWired) return;
    songWired = true;
    try{
      var c = ac();
      if (!c || !c.createMediaElementSource) return;
      songGain = c.createGain();
      songGain.gain.setValueAtTime(1, c.currentTime);
      c.createMediaElementSource(song).connect(songGain).connect(c.destination);
      if (c.state === "suspended" && c.resume) c.resume();
      // מרגע שהמנגינה עוברת במיקסר, מיקסר שנרדם משתיק אותה. חזרה למסך מעירה אותו
      document.addEventListener("visibilitychange", function(){
        try{ var cc = ac(); if (cc && cc.state === "suspended" && cc.resume) cc.resume(); }catch(e3){}
      });
      window.addEventListener("pageshow", function(){
        try{ var cc = ac(); if (cc && cc.state === "suspended" && cc.resume) cc.resume(); }catch(e4){}
      });
    }catch(e){ songGain = null; }
  }
  function songVol(v){
    songLevel = v;
    try{ song.volume = v; }catch(e){}
    if (songGain){
      try{ var c = ac(); songGain.gain.cancelScheduledValues(c.currentTime);
        songGain.gain.setValueAtTime(v, c.currentTime); }catch(e){}
    }
  }
  function songFadeOut(ms){
    clearInterval(songFadeId); songFadeId = 0;
    clearTimeout(songFadeT); songFadeT = 0;
    function land(){
      try{ song.pause(); song.currentTime = 0; }catch(e){}
      songVol(0);   // נשאר למטה. ההחזרה לעוצמה קרתה בזמן שעוד זרם שמע, ונשמעה כקפיצה
    }
    if (songGain){
      try{
        var c = ac(), t = c.currentTime, v0 = songLevel;
        songGain.gain.cancelScheduledValues(t);
        songGain.gain.setValueAtTime(v0, t);
        var ok = false;
        try{
          var curve = new Float32Array(33);
          for (var q = 0; q <= 32; q++) curve[q] = Math.max(0.0001, v0 * 0.5 * (1 + Math.cos(Math.PI * q/32)));
          songGain.gain.setValueCurveAtTime(curve, t, ms/1000);
          ok = true;
        }catch(e2){}
        if (!ok) songGain.gain.linearRampToValueAtTime(0.0001, t + ms/1000);
        songFadeT = setTimeout(land, ms + 90);
        return;
      }catch(e){}
    }
    var steps = 48, i = 0, v0b = song.volume;
    songFadeId = setInterval(function(){
      i++;
      var p = i/steps;
      try{ song.volume = Math.max(0, v0b * 0.5 * (1 + Math.cos(Math.PI * p))); }catch(e){}
      if (i >= steps){ clearInterval(songFadeId); songFadeId = 0; land(); }
    }, Math.max(16, ms/steps));
  }

  // ====== שעון חלק ======
  // הנגן מעדכן את הזמן שלו בערך ארבע פעמים בשנייה. בין עדכון לעדכון משלימים עם
  // שעון המסך ומסתנכרנים מחדש בכל דיווח, אחרת התווים קופצים במקום לזוז.
  var clkBase = -1, clkMark = 0, smT = -1, smMark = 0, smRate = 1;
  // השעון של הדפדפן מתקדם במדרגות של רבע שנייה. במקום לקפוץ אל כל מדרגה,
  // השעון שלנו רץ ברצף ומתקרב אליה בשינוי מהירות זעיר, כך שהתו זז חלק
  function songNow(){
    var ct = song.currentTime, now = performance.now();
    // הדפדפן מסמן את המנגינה כמתנגנת מיד, אבל הצליל מתחיל כשליש שנייה אחר כך.
    // עד שהשעון של השיר באמת זז, התווים עומדים. אחרת הם רצים לפי שעון המסך
    // ואז נזרקים אחורה ברגע שהצליל מתחיל
    if (song.paused || ct <= 0){ clkBase = ct; clkMark = now; smT = ct; smMark = now; smRate = 1; return ct; }
    if (ct !== clkBase){ clkBase = ct; clkMark = now; }
    var target = clkBase + (now - clkMark) / 1000;
    if (target > clkBase + 0.35) target = clkBase + 0.35;
    if (smT < 0){ smT = target; smMark = now; smRate = 1; return target; }
    smT += (now - smMark) / 1000 * smRate; smMark = now;
    /* התקרה למעלה היא על היעד בלבד, והשעון המוחלק היה בורח מעליה
       בזמן שהצליל תקוע. כאן הוא נעצר בה באמת. */
    if (smT > clkBase + 0.35){ smT = clkBase + 0.35; }
    var err = target - smT;
    /* השעון מדלג קדימה כשהוא מפגר, אבל לעולם לא חוזר אחורה.
       משיכה אחורה נראית כקפיצה של כל שורת התווים, 29 פיקסלים,
       וזה מה שקרה בכניסה ראשונה כשפענוח השיר התעכב מעל 0.7 שניות.
       במקום זה התווים עומדים עד שהצליל משיג אותם. */
    if (err > 0.3){ smT = target; smRate = 1; }
    else if (err < -0.3){ smRate = 0; }
    else { var r = err * 0.5; smRate = 1 + (r > 0.08 ? 0.08 : (r < -0.08 ? -0.08 : r)); }
    return smT;
  }

  function loop(){
    if(!running) return;
    var nowMs=performance.now(), dt=Math.min(0.05,(nowMs-lastT)/1000); lastT=nowMs;
    var t=songNow(), anyDue=false;

    notes.forEach(function(o){
      var x=PLAYHEAD+(o.arrive-t)*SPEED;
      o.el.style.transform="translate3d("+(x-HEAD_R)+"px,0,0)";
      // בנייד הלוח של המפתח קרוב לפלייהד, ולכן התו נמוג אחרי שעבר אותו
      // במקום להישאר תקוע כפיסת זהב בקצה הלוח
      if (TALL){ var fd = (x - 120) / 60; o.el.style.opacity = fd >= 1 ? "" : (fd <= 0 ? "0" : fd.toFixed(2)); }
      else if (o.el.style.opacity) o.el.style.opacity = "";
      var d=t-o.arrive;
      if(o.state==="wait"){
        if(Math.abs(d)<=WIN) anyDue=true;
        if(d>WIN){ o.state="missed"; o.el.classList.add("miss"); onMiss(""); }
      } else if(o.state==="holding"){
        anyDue=true;
      }
    });

    if(anyDue && !pressing) doKey.classList.add("due"); else doKey.classList.remove("due");

    if(!endFired && t >= PIECE_END - 0.45){
      endFired = true;
      playOutro();
      say("");
      rings.push({ x:240, y:150, r:10, life:1 });
      setTimeout(function(){ rings.push({ x:240, y:150, r:10, life:1 }); }, 280);
      spawn(240, 124, 30, { ang0:-Math.PI, ang1:0, spdMin:30, spdMax:130, g:70,
        decay:0.5, rMin:1.6, rMax:4.2, colors:["#FFC44D","#FFE7AD","#FFFFFF","#39E0D0"] });
    }
    if(song.ended || t >= PIECE_END){
      running = false;
      setTimeout(finish, 2300);
      return;
    }
    raf=requestAnimationFrame(loop);
  }

  function finish(){
    running=false; cancelAnimationFrame(raf); holdStop();
    try{ song.pause(); }catch(e){}
    doKey.classList.remove("due","down");
    var base = (window.__solBase | 0);
    // what this run is worth: everything caught the first time, the bonus on a repeat
    var earned = FIRST ? Math.max(0, coins - base)
                       : ((flawless && songHits === PIECE.length) ? BONUS : 0);
    coins = base; coinN.textContent = String(base);
    var perfect = flawless && songHits === PIECE.length;
    pourCoins(earned, function(){
      coins = base + earned; coinN.textContent = String(coins);
      if (perfect){ confetti(54); bigCoin(function(){ showSummary(earned, songHits); }); }
      else showSummary(earned, songHits);
    });
  }

  // מטר מטבעות אל הארנק, אחד אחרי השני, עם צלצול לכל אחד
  function pourCoins(total, done){
    if (!total){ done(); return; }
    tallying = false; pouring = true;   // כל מטבע שנוחת מוסיף אחד למספר
    var stage = document.getElementById("stage").getBoundingClientRect();
    var gap = Math.max(85, Math.min(260, 1500/total));
    var i = 0;
    (function step(){
      if (i >= total){
        sndTreasure();
        popPurse();
        var sr = document.getElementById("stage").getBoundingClientRect();
        spawn(240, 150, 46, { ang0:-Math.PI, ang1:0, spdMin:60, spdMax:260, g:260,
          decay:0.8, rMin:2, rMax:5.5, colors:["#FFC44D","#FFE7AD","#FFF6DC","#E09A12"] });
        rings.push({ x:240, y:150, r:8, life:1 });
        pouring = false; tallying = true;
        setTimeout(done, 1100); return;
      }
      var px = stage.left + stage.width*(0.22 + Math.random()*0.56);
      var py = stage.top  + stage.height*(0.30 + Math.random()*0.22);
      flyCoin(px, py);
      sndCoin(ac().currentTime, Math.min(i, 12));
      i++;
      setTimeout(step, gap);
    })();
  }

  function showSummary(total, hits){
    if (ovFace) ovFace.style.display = "none";
    ovT.innerHTML = '<span class="tally"><svg viewBox="0 0 26 36" width="30" height="42" aria-hidden="true">' +
      '<defs><linearGradient id="gs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE9A8"/>' +
      '<stop offset=".5" stop-color="#FFC44D"/><stop offset="1" stop-color="#E09A12"/></linearGradient></defs>' +
      '<rect x="16" y="3" width="3.4" height="22" rx="1.7" fill="url(#gs)" stroke="#A9720A" stroke-width="1"/>' +
      '<ellipse cx="10.5" cy="26.5" rx="9" ry="6.6" transform="rotate(-18 10.5 26.5)" fill="url(#gs)" stroke="#A9720A" stroke-width="1.4"/>' +
      '</svg><b>' + total + '</b></span>';
    var dots = "";
    for (var di = 0; di < PIECE.length; di++) dots += '<i class="' + (di < hits ? "hit" : "") + '"></i>';
    ovP.innerHTML = '<span class="scoreDots">' + dots + '</span>';
    ovB.innerHTML = '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 10 a14 14 0 1 0 13 9" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M22 4 l4 7 l-8 2 Z" fill="#fff"/></svg>';
    ov.classList.remove("hide");
  }

  function down(){
    if (phase === "learn1" || phase === "learn3"){
      if (pressing) return;
      pressing = true; doKey.classList.add("down"); holdStart();
      learnPress();
      return;
    }
    if(!running||pressing) return;
    pressing=true; doKey.classList.add("down"); doKey.classList.remove("due"); holdStart();
    var t=songNow(), best=-1, bestD=WIN;
    notes.forEach(function(o,i){
      if(o.state!=="wait") return;
      var d=Math.abs(t-o.arrive);
      if(d<=bestD){ bestD=d; best=i; }
    });
    if(best>=0){
      var hit=notes[best];
      hit.state="holding"; hit.pressT=t; hit.scored=true; activeIdx=best;
      hit.el.classList.add("good");
      onHit();
    }
      // לחיצה שלא נפלה על תו היא לא טעות: הקליד רק מנגן. טעות נרשמת רק כשתו עובר בלי שנגעו בו.
  }
  function up(){
    if(!pressing) return;
    pressing=false; doKey.classList.remove("down"); holdStop();
    if (phase === "learn1" || phase === "learn3"){
      if (learnReady) doKey.classList.add("due");
      return;
    }
    if(activeIdx>=0){
      var o=notes[activeIdx];
      o.state="done";
      // תו ארוך ששוחרר מוקדם מקבל הערה עדינה בלבד, לעולם לא כישלון
      if(o.n.d>=2 && (songNow()-o.pressT) < o.n.d*BEAT*HOLD_OK) say("");
      activeIdx=-1;
    }
  }

  doKey.addEventListener("pointerdown", function(e){ e.preventDefault(); down(); });
  doKey.addEventListener("touchstart", function(e){ e.preventDefault(); }, {passive:false});
  doKey.addEventListener("pointerleave", up);
  window.addEventListener("pointerup", up);
  window.addEventListener("pointercancel", up);
  ovB.addEventListener("click", begin);

  (function calib(){
    if(new URLSearchParams(location.search).get("admin")!=="1") return;
    document.getElementById("calib").classList.add("on");
    var marks=[], list=document.getElementById("cList");
    function render(){ list.innerHTML=marks.map(function(m,i){ return (i+1)+". "+m.toFixed(2)+"s (beat "+(m/BEAT).toFixed(2)+")"; }).join("<br>"); list.scrollTop=list.scrollHeight; }
    document.getElementById("cMark").addEventListener("click",function(){ marks.push(song.currentTime); render(); });
    document.getElementById("cUndo").addEventListener("click",function(){ marks.pop(); render(); });
    document.getElementById("cClear").addEventListener("click",function(){ marks.length=0; render(); });
    document.getElementById("cCopy").addEventListener("click",function(){
      var txt=marks.map(function(m){ return Math.round(m/BEAT*2)/2; }).join(", ");
      try{ navigator.clipboard.writeText(txt); }catch(e){}
      list.innerHTML="<b>beats:</b><br>"+txt;
    });
  })();

  function fit(){
    var box=document.querySelector(".fit"), sc=document.getElementById("scaler");
    var k=Math.min(box.clientWidth/480, box.clientHeight/SH, 1.3);
    if(!isFinite(k)||k<=0) k=1;
    // הקופסה נשארת במידות המקור, והמיקום מחושב במפורש כדי שתמיד תהיה במרכז
    sc.style.width="480px"; sc.style.height=SH+"px";
    var dx=Math.round((box.clientWidth-480*k)/2), dy=Math.round((box.clientHeight-SH*k)/2);
    sc.style.transform="translate("+dx+"px,"+dy+"px) scale("+k+")";
  }
  function relayout(){
    fcRects = null; fcCoin = null;   // מסך השתנה, המדידות נלקחות מחדש
    var was = TALL;
    setLayout();
    if (was === TALL){ fit(); return; }
    drawStaffNow();
    placeLedgerNow();
    var all = document.querySelectorAll("#track .note");
    for (var i = 0; i < all.length; i++){
      all[i].style.top = (DO_Y - HEAD_R) + "px";
    }
    fit();
  }
  // בנייד סרגל הכתובת נכנס ויוצא ומשנה את גובה החלון בלי ששום דבר באמת השתנה.
  // בנייה מחדש על כל שינוי כזה נראית כקפיצה של כל המסך באמצע השיר.
  var lastW = window.innerWidth, lastH = window.innerHeight;
  function onResize(){
    var w = window.innerWidth, h = window.innerHeight;
    var small = (w === lastW) && Math.abs(h - lastH) < 140;
    lastW = w; lastH = h;
    if (small){ return; }
    relayout();
  }
  window.addEventListener("resize", onResize);
  window.addEventListener("orientationchange", function(){
    lastW = window.innerWidth; lastH = window.innerHeight; relayout();
  });
  fit(); setTimeout(fit,120); setTimeout(fit,500);
})();
</script>
<script>
(function(){
  function send(n){
    var base = (window.__solBase | 0);
    n = Math.max(0, n - base);
    var gold = (window.__solGold | 0);
    try{ parent.postMessage({ sol:"done", coins:n, gold:gold, which:(window.__solWhich || "") }, "*"); }catch(e){}
  }
  var ov = document.getElementById("ov");
  var coinN = document.getElementById("coinN");
  if (!ov || !coinN) return;
  var sent = false;

  // the ending is not the end of the road: the board opens and the road grows
  function homeSoon(){
    try{ ov.style.transition = "none"; ov.style.opacity = "0"; ov.style.pointerEvents = "none"; }catch(e){}
    setTimeout(function(){ try{ parent.postMessage({ sol:"back" }, "*"); }catch(e){} }, 650);
  }
  function addNext(){
    var nx = window.__solNext;
    if (!nx || document.getElementById("solNext")) return;
    var b = document.createElement("button");
    b.id = "solNext"; b.className = "btn next";
    b.setAttribute("aria-label", "\u05d4\u05d1\u05d0");
    b.innerHTML = '<img src="' + nx.img + '" alt="">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M14 6 L8 12 L14 18"/></svg>';
    b.addEventListener("click", function(){ parent.postMessage({ sol:"open", id:nx.id }, "*"); });
    var ovB = document.getElementById("ovB");
    if (ovB && ovB.parentNode) ovB.parentNode.insertBefore(b, ovB);
    var st = document.createElement("style");
    st.textContent = ".overlay{gap:10px}" +
      ".btn.next{width:118px;height:118px;padding:0;border-radius:50%;position:relative;overflow:visible;" +
      "background:linear-gradient(180deg,#FFD36E,#FFC44D);box-shadow:inset 0 1px 0 rgba(255,255,255,.8)," +
      "0 7px 0 0 #B07C06,0 0 38px -4px rgba(255,196,77,.95);animation:nextBeat 2.2s ease-in-out infinite}" +
      ".btn.next img{width:92px;height:92px;border-radius:50%;object-fit:cover;display:block;margin:0 auto;" +
      "border:3px solid #fff}" +
      ".btn.next svg{position:absolute;inset-inline-end:-6px;bottom:4px;width:30px;height:30px;" +
      "background:#7B6BFF;border-radius:50%;padding:4px;box-shadow:0 3px 0 0 #4f41b8}" +
      "@keyframes nextBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}" +
      "#ovB{width:58px;height:58px;opacity:.85}#ovB svg{width:28px;height:28px}";
    document.head.appendChild(st);
  }

  new MutationObserver(function(){
    var open = !ov.classList.contains("hide");
    var started = document.getElementById("intro") &&
                  document.getElementById("intro").classList.contains("gone");
    if (open && started && !sent){ sent = true; send(parseInt(coinN.textContent,10) || 0); homeSoon(); }
    if (!open) sent = false;
  }).observe(ov, { attributes:true, attributeFilter:["class"] });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") parent.postMessage({ sol:"back" }, "*"); });
})();
</script>
