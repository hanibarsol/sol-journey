<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>סמן של משחק</title>
<style>
  :root{ --gold:#FFC44D; --goldLight:#FFE7AD; --goldDark:#B07C06; --ink:#1d1338; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:#1b1038;
    font-family:system-ui,"Segoe UI",Arial,sans-serif; color:#e9e3ff; }
  .wrap{ max-width:560px; margin:0 auto; padding:16px 14px 40px; }
  h1{ font-size:19px; margin:0 0 4px; color:#FFD987; }
  .sub{ margin:0 0 18px; font-size:13.5px; line-height:1.6; color:#c9c0ef; }
  h2{ font-size:15px; margin:22px 0 8px; color:#b9b0e0; }

  .row{ display:flex; flex-wrap:wrap; gap:18px 14px; align-items:flex-start; }
  .cell{ width:104px; text-align:center; }
  .road{ position:relative; height:104px; border-radius:16px; overflow:hidden;
    background-image:url(demo/road_bg.webp); background-size:cover;
    background-position:center 58%; }
  .stone{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:72px; height:72px; border-radius:50%; overflow:visible;
    background:linear-gradient(180deg,var(--goldLight),var(--gold));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.85), 0 6px 0 0 var(--goldDark),
               0 0 34px -2px rgba(255,196,77,.95); }
  .stone .face{ position:absolute; inset:0; border-radius:50%; overflow:hidden; }
  .stone .face img{ width:100%; height:100%; object-fit:cover; display:block; }
  .badge{ position:absolute; inset-inline-end:-6px; bottom:-6px; width:28px; height:28px;
    border-radius:50%; background:#2a1f4d; border:3px solid var(--ink); z-index:3;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 0 0 var(--ink), 0 8px 14px -6px rgba(0,0,0,.8); }
  .badge svg{ width:15px; height:15px; display:block; }
  .nm{ margin-top:8px; font-size:13px; font-weight:800; color:#FFD987; }
  .ex{ font-size:11.5px; color:#9b93c9; line-height:1.45; margin-top:2px; }
  .note{ margin-top:26px; font-size:13.5px; line-height:1.7; color:#c9c0ef; }
  .note b{ color:#FFD987; }
</style>
</head>
<body>
<div class="wrap">
  <h1>סמן של משחק על האבן</h1>
  <p class="sub">למעלה חמשת הסמלים שכבר קיימים, ולמטה ארבע הצעות לסמל השישי.
    הכל בגודל האמיתי ועל רקע הדרך.</p>

  <h2>מה שיש היום</h2>
  <div class="row" id="old"></div>

  <h2>ארבע הצעות למשחק</h2>
  <div class="row" id="new"></div>

  <p class="note">הסמל יושב בפינת האבן, באותו עיגול כהה של כל השאר.
    מה שמשתנה הוא <b>רק הציור שבתוכו</b>.</p>
</div>

<script>
(function(){
  var G = '#FFC44D';
  var OLD = [
    ["שיר", "תו בודד",
     '<rect x="13.4" y="3" width="2.6" height="13" rx="1.3" fill="'+G+'"/>' +
     '<ellipse cx="9.6" cy="16.4" rx="5.2" ry="4" transform="rotate(-18 9.6 16.4)" fill="'+G+'"/>'],
    ["שמיעה", "תו וגלי קול",
     '<circle cx="8.5" cy="12" r="3.6" fill="'+G+'"/>' +
     '<path d="M14.6 8.4 a5.2 5.2 0 0 1 0 7.2" fill="none" stroke="'+G+'" stroke-width="2.1" stroke-linecap="round"/>' +
     '<path d="M18.2 5.6 a9 9 0 0 1 0 12.8" fill="none" stroke="'+G+'" stroke-width="2.1" stroke-linecap="round" opacity=".55"/>'],
    ["שני צלילים", "שני עיגולים",
     '<circle cx="7" cy="12" r="3.4" fill="'+G+'"/>' +
     '<circle cx="16.4" cy="12" r="3.4" fill="'+G+'" opacity=".75"/>' +
     '<path d="M11.2 9.6 a3.4 3.4 0 0 1 0 4.8" fill="none" stroke="'+G+'" stroke-width="1.8" stroke-linecap="round" opacity=".7"/>'],
    ["פגישה", "תו עם הילה",
     '<circle cx="12" cy="13" r="5.4" fill="'+G+'"/>' +
     '<rect x="16.2" y="3" width="2.4" height="11" rx="1.2" fill="'+G+'"/>' +
     '<circle cx="12" cy="13" r="8.6" fill="none" stroke="'+G+'" stroke-width="1.4" opacity=".55"/>'],
    ["קריאה", "תו על קווים",
     '<path d="M3.5 7.5 h17 M3.5 16.5 h17" stroke="'+G+'" stroke-width="2" stroke-linecap="round" opacity=".85"/>' +
     '<circle cx="12" cy="12" r="3.6" fill="'+G+'"/>']
  ];

  var NEW = [
    ["א. קלפים", "שני קלפים בזווית",
     '<rect x="4.2" y="6.6" width="9.6" height="13" rx="2" fill="'+G+'" opacity=".55" transform="rotate(-14 9 13)"/>' +
     '<rect x="10.2" y="4.8" width="9.6" height="13" rx="2" fill="'+G+'" transform="rotate(10 15 11.3)"/>'],
    ["ב. סידור", "שלושה בגובה עולה",
     '<rect x="3.6" y="13.5" width="4.4" height="6.5" rx="1.4" fill="'+G+'" opacity=".6"/>' +
     '<rect x="9.8" y="9.5" width="4.4" height="10.5" rx="1.4" fill="'+G+'" opacity=".8"/>' +
     '<rect x="16" y="5" width="4.4" height="15" rx="1.4" fill="'+G+'"/>'],
    ["ג. אצבע", "יד שגוררת",
     '<path d="M9.4 13.2 V5.6 a1.7 1.7 0 0 1 3.4 0 v6.2" fill="none" stroke="'+G+'" stroke-width="2.1" stroke-linecap="round"/>' +
     '<path d="M12.8 11.2 a1.6 1.6 0 0 1 3.2 0 v1.6 M16 12.2 a1.6 1.6 0 0 1 3.2 0 v2.4" fill="none" stroke="'+G+'" stroke-width="2" stroke-linecap="round"/>' +
     '<path d="M9.4 13.2 l-2.6 2.2 a2 2 0 0 0 .2 3 l3.6 2.4 h6.6 a2.4 2.4 0 0 0 2.4 -2.4" fill="none" stroke="'+G+'" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>'],
    ["ד. כוכב משחק", "כוכב עם תו בפנים",
     '<path d="M12 2.4 L14.6 8.4 L21 9 L16.2 13.2 L17.6 19.6 L12 16.4 L6.4 19.6 L7.8 13.2 L3 9 L9.4 8.4 Z" fill="'+G+'" opacity=".9"/>' +
     '<rect x="12.5" y="7.6" width="1.6" height="6" rx=".8" fill="#2a1f4d"/>' +
     '<ellipse cx="10.6" cy="13.6" rx="2.6" ry="2" transform="rotate(-18 10.6 13.6)" fill="#2a1f4d"/>']
  ];

  function cell(name, ex, svg, face){
    var d = document.createElement("div");
    d.className = "cell";
    d.innerHTML =
      '<div class="road"><div class="stone">' +
      '<div class="face"><img src="demo/faces/' + face + '.jpg" alt=""></div>' +
      '<div class="badge"><svg viewBox="0 0 24 24" aria-hidden="true">' + svg + '</svg></div>' +
      '</div></div>' +
      '<div class="nm">' + name + '</div><div class="ex">' + ex + '</div>';
    return d;
  }

  var faces = ["do","re","mi","fa","sol","la","si"];
  var oldBox = document.getElementById("old"), newBox = document.getElementById("new");
  OLD.forEach(function(o, i){ oldBox.appendChild(cell(o[0], o[1], o[2], faces[i % faces.length])); });
  NEW.forEach(function(o, i){ newBox.appendChild(cell(o[0], o[1], o[2], faces[(i + 2) % faces.length])); });
})();
</script>
</body>
</html>
