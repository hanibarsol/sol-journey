<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>המקום של מפתח סול</title>
<style>
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:#1b1038;
    font-family:system-ui,"Segoe UI",Arial,sans-serif; color:#e9e3ff; }
  .wrap{ max-width:560px; margin:0 auto; padding:16px 12px 44px; }
  h1{ font-size:19px; margin:0 0 4px; color:#FFD987; }
  .sub{ margin:0 0 18px; font-size:13.5px; line-height:1.65; color:#c9c0ef; }
  .sub b{ color:#FFD987; }

  .case{ margin-bottom:14px; border-radius:16px; overflow:hidden;
    border:1.5px solid #51428c; background:#2b2050; }
  .lab{ display:flex; justify-content:space-between; align-items:center;
    padding:9px 14px; font-size:14.5px; font-weight:800; color:#FFD987; }
  .lab span{ font-weight:400; font-size:12.5px; color:#b9b0e0; }
  .paper{ position:relative; background:#fdf6e6; height:240px; overflow:hidden; }
  .scene{ position:absolute; left:0; top:0; width:480px; height:240px;
    transform-origin:top left; }
  .ln{ position:absolute; left:0; width:480px; height:1.7px; background:#241B3D; opacity:.8; }
  .sol{ position:absolute; left:0; width:480px; height:3px; background:#17A79B; opacity:.95; }
  .solTag{ position:absolute; left:8px; font-size:12px; font-weight:800; color:#17A79B; }
  .clef{ position:absolute; display:block; width:auto; }
  .note{ margin-top:22px; font-size:13.5px; line-height:1.7; color:#c9c0ef; }
  .note b{ color:#FFD987; }
</style>
</head>
<body>
<div class="wrap">
  <h1>המקום של מפתח סול</h1>
  <p class="sub">החמשה האמיתית של השיעורים, והמפתח בגודל האמיתי שלו.
    הקו <b>הטורקיז הוא הקו של סול</b>, השני מלמטה. העיגול של המפתח צריך לשבת עליו.
    בכל תצוגה המפתח מורם קצת יותר.</p>

  <div id="list"></div>

  <p class="note">תגידי איזו מהן נכונה ואני מיישמת אותה <b>בכל מקום שיש בו חמשה</b>:
    שלבי התרגול, שבעת השירים ומסך ההלחנה.</p>
</div>

<script>
(function(){
  /* הגאומטריה האמיתית מהשיעור: קווים ב-22 52 82 112 142, המפתח בגובה 246 */
  var LINES = [22, 52, 82, 112, 142], SOL = 112;
  var CLEF_LEFT = 21, CLEF_H = 246, BASE_TOP = 45;
  var STEPS = [
    { d: 0,   n: "מה שיש היום" },
    { d: -20, n: "מורם ב-20" },
    { d: -40, n: "מורם ב-40" },
    { d: -60, n: "מורם ב-60" },
    { d: -80, n: "מורם ב-80" }
  ];
  var list = document.getElementById("list");

  STEPS.forEach(function(s){
    var c = document.createElement("div");
    c.className = "case";
    var inner = '<div class="lab">' + s.n + '<span>top ' + (BASE_TOP + s.d) + '</span></div>' +
      '<div class="paper"><div class="scene">';
    LINES.forEach(function(y){
      if (y === SOL) return;
      inner += '<i class="ln" style="top:' + y + 'px"></i>';
    });
    inner += '<i class="sol" style="top:' + (SOL - 1) + 'px"></i>' +
             '<span class="solTag" style="top:' + (SOL - 18) + 'px">סול</span>' +
             '<img class="clef" src="demo/clef.png" alt="" style="left:' + CLEF_LEFT +
             'px; top:' + (BASE_TOP + s.d) + 'px; height:' + CLEF_H + 'px">' +
             '</div></div>';
    c.innerHTML = inner;
    list.appendChild(c);
  });

  /* הבמה מוקטנת לרוחב המסך, בדיוק כמו בשיעור */
  function fit(){
    var ws = document.querySelectorAll(".paper");
    Array.prototype.forEach.call(ws, function(p){
      var k = p.clientWidth / 480;
      var sc = p.querySelector(".scene");
      sc.style.transform = "scale(" + k.toFixed(4) + ")";
      p.style.height = Math.round(240 * k) + "px";
    });
  }
  fit();
  window.addEventListener("resize", fit);
})();
</script>
</body>
</html>
